name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/Kars.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: kars
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk API-Proxy-v1.0.3.apk
          ls -la

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-Proxy-v1.0.3
          path: app/build/outputs/apk/release/API-Proxy-v1.0.3.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: API Proxy v1.0.3
          body: |
            ## API Proxy v1.0.3 - 正式签名版
            
            ### 修复
            - 🐛 修复启动闪退（缺少 setContentView）
            - 🐛 修复日志展开/收起逻辑
            - 🔄 重写代理转发，改用 HttpsURLConnection（支持HTTPS）
            - 🔐 正式签名（Kars.jks）
            
            ### 功能
            - 🔄 本地HTTP代理服务器
            - 🔑 自动注入API Key
            - 📡 支持SSE流式转发
            - 🎨 Material You 风格界面
            - ⚙️ 预设OpenAI/Gemini/Claude/DeepSeek配置
          files: app/build/outputs/apk/release/API-Proxy-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
