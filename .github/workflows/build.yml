name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk API-Proxy-v1.0.2.apk
          ls -la

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-Proxy-v1.0.2
          path: app/build/outputs/apk/debug/API-Proxy-v1.0.2.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: API Proxy v1.0.2
          body: |
            ## API Proxy v1.0.2 - 闪退修复版
            
            ### 修复
            - 🐛 修复启动闪退（缺少 setContentView）
            - 🐛 修复日志展开/收起逻辑
            - 🔄 重写代理转发，改用 HttpsURLConnection（支持HTTPS）
            - ⚡ 流式响应更稳定
            
            ### 功能
            - 🔄 本地HTTP代理服务器
            - 🔑 自动注入API Key
            - 📡 支持SSE流式转发
            - 🎨 Material You 风格界面
            - ⚙️ 预设OpenAI/Gemini/Claude/DeepSeek配置
            - 📋 实时转发日志
          files: app/build/outputs/apk/debug/API-Proxy-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
