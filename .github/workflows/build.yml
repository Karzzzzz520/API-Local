name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/Kars.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: kars
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk API-Proxy-v1.1.1.apk
          ls -la

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-Proxy-v1.1.1
          path: app/build/outputs/apk/release/API-Proxy-v1.1.1.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: API Proxy v1.1.1
          body: |
            ## API Proxy v1.1.1 - NanoHTTPD重写版
            
            ### 重大改进
            - 🔄 用NanoHTTPD替换手写ServerSocket，HTTP解析稳定
            - 🔑 正确转发API请求并注入Key
            - 📡 支持SSE流式响应
            - 🎯 路径路由：/openai/ /gemini/ /claude/ /deepseek/
            - 🏠 默认路由到第一个有Key的provider
            - 🔐 Kars.jks正式签名
            
            ### 用法
            1. 添加API服务商和Key
            2. 开启代理
            3. 其他APP设置Base URL为 `http://localhost:8080`
          files: app/build/outputs/apk/release/API-Proxy-v1.1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
